<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071b33">
<meta name="robots" content="noindex,nofollow">
<title>Quadro Virtual | Departamento Nacional da Música</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071b33}
#board{display:block;width:100%;height:100%;height:100dvh;border:0;background:#071b33}
</style>
</head>
<body>
<iframe id="board" title="Identificação para entrar na aula — Departamento Nacional da Música"
 allow="camera; microphone; fullscreen; display-capture; autoplay; clipboard-read; clipboard-write"
 allowfullscreen referrerpolicy="same-origin"></iframe>
<script>
/* Mantém o convite curto no endereço público, mas apresenta o formulário institucional antes de abrir o quadro. */
const incoming=new URLSearchParams(location.search);
const entry=new URL("../entrar.html",location.href);
entry.searchParams.set("sala",incoming.get("r")||"");
entry.searchParams.set("sess",incoming.get("s")||"");
entry.searchParams.set("aluno","1");
if(incoming.has("a"))entry.searchParams.set("atividade",incoming.get("a"));
if(incoming.has("dn"))entry.searchParams.set("dirNome",incoming.get("dn"));
if(incoming.has("df"))entry.searchParams.set("dirFuncao",incoming.get("df"));
if(incoming.has("dp"))entry.searchParams.set("dirProvincia",incoming.get("dp"));
if(incoming.has("dm"))entry.searchParams.set("dirMunicipio",incoming.get("dm"));
document.getElementById("board").src=entry.href;
</script>
</body>
</html>
