<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071b33">
<meta name="robots" content="noindex,nofollow">
<title>Quadro Virtual | Departamento Nacional da Música</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071b33}
#board{display:block;width:100%;height:100%;height:100dvh;border:0;background:#071b33}
</style>
</head>
<body>
<iframe id="board" title="Identificação para entrar na aula — Departamento Nacional da Música"
 allow="camera; microphone; fullscreen; display-capture; autoplay; clipboard-read; clipboard-write"
 allowfullscreen referrerpolicy="same-origin"></iframe>
<script>
/* Mantém o convite curto no endereço público, mas apresenta o formulário institucional antes de abrir o quadro. */
const incoming=new URLSearchParams(location.search);
const room=incoming.get("r")||"",session=incoming.get("s")||"";
const entry=new URL("../entrar.html",location.href);
entry.searchParams.set("sala",room);
entry.searchParams.set("sess",session);
entry.searchParams.set("aluno","1");
if(incoming.has("a"))entry.searchParams.set("atividade",incoming.get("a"));
if(incoming.has("dn"))entry.searchParams.set("dirNome",incoming.get("dn"));
if(incoming.has("df"))entry.searchParams.set("dirFuncao",incoming.get("df"));
if(incoming.has("dp"))entry.searchParams.set("dirProvincia",incoming.get("dp"));
if(incoming.has("dm"))entry.searchParams.set("dirMunicipio",incoming.get("dm"));
/* O convite de ensaio deve SEMPRE apresentar primeiro o formulário institucional.
   O perfil guardado serve apenas para pré-preencher os dados; não pode saltar a identificação
   nem o pedido de aprovação do director. A actualização durante um ensaio ocorre em quadro.html
   e continua a restaurar a participação aprovada sem regressar a esta página. */
let saved=null;
try{saved=JSON.parse(localStorage.getItem("dnm_profile_v1")||"null")}catch(_){}
if(saved&&saved.name){
 entry.searchParams.set("nome",saved.name);
 entry.searchParams.set("funcao",saved.role||"corista");
 entry.searchParams.set("provincia",saved.province||"");
 entry.searchParams.set("municipio",saved.municipality||"");
 entry.searchParams.set("atividade",saved.activity||incoming.get("a")||"ensaio");
 if(saved.voice)entry.searchParams.set("voz",saved.voice);
 if(saved.instrument)entry.searchParams.set("instrumento",saved.instrument);
}
document.getElementById("board").src=entry.href;
</script>
</body>
</html>
